# Compila el APK de Andify para Android en la nube y lo deja listo para bajar.
# Subi esta carpeta a un repositorio de GitHub y la accion corre sola.
name: Build Andify Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Las maquinas de GitHub ya traen el SDK de Android: solo se aceptan las licencias
      # y se asegura que esten las piezas que usa la app.
      - name: Preparar el SDK de Android
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK en: $SDK"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - name: Dejar el APK con un nombre claro
        run: cp app/build/outputs/apk/debug/app-debug.apk Andify.apk

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: andify-android-apk
          path: Andify.apk
